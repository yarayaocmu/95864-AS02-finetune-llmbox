  - q_proj
  - k_proj
  - v_proj
  - o_proj
  run_name: exp3_attention_only
  prefix_length: 30
  adapters_dim: 64
  bitfit_bias_params: []
  freeze_modules: []
  logging_steps: 5
  save_steps: 1000
  eval_steps: 25
  output_dir: ./finetuned_exp3_attention_only
  merge_adapter: true
  token_budget: 1000000
  report_metrics: true
prompt: null
prompt_file: null
username: null
system_prompt: You are a helpful assistant.
seed: 42
output_dir: outputs
metrics: null
