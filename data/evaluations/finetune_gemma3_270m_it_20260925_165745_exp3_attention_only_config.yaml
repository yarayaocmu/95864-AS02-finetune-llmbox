model:
  name: gemma3_270m_it
  source: local
  model_id: google/gemma-3-270m-it
  local_path: models/llms/google/gemma-3-270m-it
  architecture: gemma3_text
  dtype: bfloat16
  device: auto
  trust_remote_code: false
  supports_tool_calling: false
  supports_structured_output: true
  tool_calling_format: generic
  chat_template_kwargs: {}
  assistant_mask_strategy: verified_prefix
  add_prefix: null
  add_suffix: null
  add_specialtokens: []
mode:
  name: finetune
data:
  type: jsonl
  path: data/as02/splits/train.jsonl
  min_turns: 1
  eval_split: 0.1
  raw_path: null
  original_path: null
  text_columns: []
  target_columns: []
  label_maps: {}
  instruction: ''
  output_dir: null
  train_fraction: null
  split: null
optimizer:
  name: adamw
  learning_rate: 0.0002
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  momentum: 0.0
generation:
  max_new_tokens: 512
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  do_sample: true
  repetition_penalty: 1.0
